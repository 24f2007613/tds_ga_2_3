# Q6: FastAPI api + Redis. Run:  docker compose up --build
# Then expose:  cloudflared tunnel --url http://localhost:8000
services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      STUDENT_EMAIL: ${STUDENT_EMAIL:-CHANGE_ME@example.com}
    depends_on:
      - redis
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped
volumes:
  redis-data:
